<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Booyah Battle — Free Fire Tournaments</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b10;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:520px;margin:auto;padding:18px}.hero{padding:28px 0;text-align:center}
h1{font-size:34px;margin:5px 0}.accent{color:#ffb300}.card{background:#15151d;border:1px solid #292936;border-radius:18px;padding:18px;margin:14px 0}
label{display:block;margin:12px 0 6px;color:#bbb;font-size:14px}
input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #363642;background:#0e0e14;color:#fff}
button{width:100%;padding:14px;border:0;border-radius:11px;background:#ffb300;color:#111;font-weight:800;font-size:16px;margin-top:15px}
.small{font-size:12px;color:#999;line-height:1.5}.success{display:none;text-align:center;padding:20px}.error{color:#ff7272;font-size:13px;margin-top:10px}
</style>
</head>
<body><div class="wrap">
<section class="hero"><div class="accent">🔥 BOOYAH BATTLE</div><h1>FREE FIRE TOURNAMENTS</h1><p class="small">Join • Compete • Win</p></section>
<div class="card">
<h2>Join Tournament</h2>
<form id="joinForm">
<label>Tournament</label>
<select name="tournament" required>
<option value="Booyah Battle #01">Booyah Battle #01 — ₹20 Entry</option>
<option value="Booyah Battle #02">Booyah Battle #02 — ₹30 Entry</option>
</select>
<label>Free Fire UID</label><input name="uid" inputmode="numeric" required placeholder="Enter your UID">
<label>In-game Name</label><input name="ign" required placeholder="Enter your IGN">
<label>WhatsApp / Telegram Username</label><input name="contact" placeholder="@username or number">
<label>Match / Slot</label><select name="match"><option>Match 1</option><option>Match 2</option><option>Match 3</option></select>
<button type="submit">JOIN TOURNAMENT</button>
<div class="error" id="err"></div>
</form>
<div class="success" id="success"><h2>✅ Joined Successfully</h2><p>Your registration has been received.</p><p class="small">Keep your tournament details safe.</p></div>
</div>
<p class="small">By joining, you confirm that the submitted tournament information is correct. Follow the tournament rules.</p>
</div>
<script>
const f=document.getElementById('joinForm'), e=document.getElementById('err');
f.addEventListener('submit',async(ev)=>{
 ev.preventDefault(); e.textContent='';
 const data=Object.fromEntries(new FormData(f));
 try{
  const r=await fetch('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  const j=await r.json(); if(!r.ok) throw new Error(j.error||'Submission failed');
  f.style.display='none';document.getElementById('success').style.display='block';
 }catch(x){e.textContent=x.message}
});
</script></body></html>
